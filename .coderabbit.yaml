# CodeRabbit configuration.
#
# main now holds the application, so a pull request diffs against it and shows
# only what changed. The 100-file free-tier cap stopped being the binding
# constraint the moment PR #1 merged — the previous version of this file
# excluded most of the repository to get one 242-file import under that cap,
# and every one of those exclusions would now be hiding real work.
#
# What is left is the ordinary list: things a reviewer cannot act on.
#
#   public/**        images and icons
#   pnpm-lock.yaml   machine-generated, thousands of lines
#   *.md             prose
#   .next, coverage  build output, ignored by git anyway but cheap to state
#
# TESTS ARE DELIBERATELY REVIEWED. The API repo excludes them because its
# suite is large enough to crowd out the migrations that were the point of the
# review. Nothing here is near the cap, and a test asserting the wrong thing is
# worth catching — pricing.test.ts encoded a shape the API does not send and
# nobody noticed until the type-check was made to run.

reviews:
  path_filters:
    - "!public/**"
    - "!pnpm-lock.yaml"
    - "!**/*.md"
    - "!.next/**"
    - "!coverage/**"
