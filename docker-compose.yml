name: footloose-client

services:
  # Next.js Frontend
  frontend:
    build:
      context: .
      target: development
    container_name: footloose-frontend-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    env_file:
      - .env.local
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    command: pnpm run dev

networks:
  default:
    name: footloose-api_footloose-network
    external: true
