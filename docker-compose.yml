name: footloose-client

services:
  # Next.js Frontend
  frontend:
    build:
      context: .
      target: development
    container_name: footloose-frontend-dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    # Optional: .env.local is untracked and the README tells developers to
    # create it themselves, so a fresh clone had `docker compose up` fail
    # before the container started. Needs Compose 2.24 or newer.
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    command: pnpm run dev

networks:
  default:
    name: footloose-api_footloose-network
    external: true
